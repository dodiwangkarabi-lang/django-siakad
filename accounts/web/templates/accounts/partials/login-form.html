<div
  class="bg-gradient-to-br from-blue-100 via-white to-indigo-100 min-h-screen flex items-center justify-center"
>
  <div class="w-full max-w-md px-6">
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <!-- Logo -->
      <div class="flex justify-center mb-6">
        <div
          class="bg-blue-600 text-white w-20 h-20 rounded-full flex items-center justify-center shadow-lg"
        >
          <ion-icon name="school-outline" class="text-5xl"></ion-icon>
        </div>
      </div>

      <!-- Judul -->
      <h2 class="text-3xl font-bold text-center text-gray-800">SIAKAD</h2>

      <p class="text-center text-gray-500 mt-2 mb-8 leading-relaxed">
        Sistem Informasi Akademik
      </p>

      <!-- Form -->
      <form action="#" method="POST" class="space-y-5">
        {% csrf_token %}

        <!-- Username -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Username
          </label>

          <div class="relative">
            <span class="absolute left-3 top-3 text-gray-400">
              <ion-icon name="person-outline"></ion-icon>
            </span>

            <input
              type="text"
              name="username"
              autocomplete="username"
              placeholder="Masukkan username"
              class="w-full pl-10 pr-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
            />
          </div>
        </div>

        <!-- Password -->
        <div x-data="{ showPassword: false }">
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Password
          </label>

          <div class="relative">
            <span class="absolute left-3 top-3 text-gray-400">
              <ion-icon name="lock-closed-outline"></ion-icon>
            </span>

            <input
              :type="showPassword ? 'text' : 'password'"
              name="password"
              autocomplete="current-password"
              placeholder="Masukkan password"
              class="w-full pl-10 pr-10 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
            />

            <button
              type="button"
              @click="showPassword = !showPassword"
              class="absolute right-3 top-3 text-gray-400 hover:text-blue-600"
            >
              <ion-icon
                :name="showPassword ? 'eye-off-outline' : 'eye-outline'"
              ></ion-icon>
            </button>
          </div>
        </div>

        <!-- Remember -->
        {% comment %} <div class="flex items-center justify-between text-sm">
          <label class="flex items-center gap-2">
            <input
              type="checkbox"
              name="remember"
              class="rounded text-blue-600"
            />
            <span>Ingat saya</span>
          </label>

          <a href="#" class="text-blue-600 hover:underline"> Lupa Password? </a>
        </div> {% endcomment %}

        <!-- Button -->
        <button
          type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-semibold transition duration-300"
        >
          Masuk
        </button>
      </form>
      <!-- ---------- endform ---------- -->

      <!-- Divider -->
      {% comment %}
      <div class="flex items-center my-6">
        <div class="flex-1 border"></div>
        <span class="mx-3 text-gray-400 text-sm">OR</span>
        <div class="flex-1 border"></div>
      </div>
      {% endcomment %}

      <!-- Google -->
      {% comment %}
      <button
        class="w-full border rounded-lg py-3 flex items-center justify-center gap-3 hover:bg-gray-100 transition"
      >
        <ion-icon name="logo-google" class="text-xl text-red-500"></ion-icon>

        Continue with Google
      </button>

      <!-- Register -->
      <p class="text-center text-gray-500 mt-8">
        Don't have an account?

        <a href="#" class="text-blue-600 font-semibold hover:underline">
          Register
        </a>
      </p>
      {% endcomment %}
    </div>
  </div>
</div>

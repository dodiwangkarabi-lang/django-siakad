<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.tailwindcss.com"></script>

    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <title>Detail KRS</title>
  </head>
  <body class="bg-gray-100 min-h-screen p-6">
    <div x-data="detailKRS()" x-init="loadData()" class="max-w-5xl mx-auto">
      <!-- Loading -->
      <div x-show="loading" class="bg-white rounded-xl shadow p-6 text-center">
        Loading...
      </div>

      <!-- Error -->
      <div
        x-show="error"
        class="bg-red-100 text-red-700 p-4 rounded-xl mb-4"
        x-text="error"
      ></div>

      <!-- Data -->
      <template x-for="kelas in daftarKelas" :key="kelas.kelas.id">
        <div class="bg-white rounded-2xl shadow mb-6 overflow-hidden">
          <!-- Header -->
          <div class="border-b p-5 bg-gray-50">
            <h2
              class="text-xl font-bold text-gray-800"
              x-text="kelas.kelas.nama"
            ></h2>

            <div class="mt-2 text-sm text-gray-600">
              <span x-text="kelas.kelas.mata_kuliah.kode"></span>

              -

              <span x-text="kelas.kelas.mata_kuliah.nama"></span>
            </div>
          </div>

          <!-- Peserta -->
          <div class="p-5">
            <table class="w-full border-collapse">
              <thead>
                <tr class="border-b">
                  <th class="text-left py-2 w-16">No</th>
                  <th class="text-left py-2">NIM</th>
                  <th class="text-left py-2">Nama</th>
                </tr>
              </thead>

              <tbody>
                <template
                  x-for="(peserta, index) in kelas.peserta"
                  :key="peserta.nim"
                >
                  <tr class="border-b last:border-0">
                    <td class="py-2" x-text="index + 1"></td>

                    <td class="py-2" x-text="peserta.nim"></td>

                    <td class="py-2" x-text="peserta.nama"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </template>
    </div>

    <script>
      function detailKRS() {
        return {
          loading: false,

          error: null,

          daftarKelas: [],

          async loadData() {
            this.loading = true;

            try {
              const response = await axios.get(
                "http://127.0.0.1:8000/academic/api/detail/",
              );

              this.daftarKelas = response.data;
            } catch (err) {
              this.error = "Gagal mengambil data";

              console.error(err);
            } finally {
              this.loading = false;
            }
          },
        };
      }
    </script>
  </body>
</html>

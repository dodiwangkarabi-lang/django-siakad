<form
  method="POST"
  class="max-w-2xl mx-auto bg-white shadow-md rounded-2xl p-6 space-y-6"
>
  {% csrf_token %}

  <!-- pesan sukses -->
    {% include "features/krs/components/pesan-sukses.html" %}


  <!-- Title -->
  <h2 class="text-xl font-semibold text-gray-800">Gabung Kelas</h2>

  <!-- ================= INPUT TEXT ================= -->
  <div class="space-y-4">
    <!-- jumlah_sks -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Tahun Ajaran
      </label>
      <input
        type="text"
        name="tahun_ajaran"
        value="2025/2026"
        required
        class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-400 focus:outline-none"
        placeholder="Masukkan Tahun Ajaran"
      />
    </div>

    
  </div>

  <!-- semester -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Semester
      </label>

      <select
        name="semester"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-blue-400 focus:outline-none"
      >
        <option value="">-- Pilih Semester --</option>
        <option value="ganjil">Ganjil</option>
        <option value="genap">Genap</option>
      </select>
    </div>

  <!-- ================= MAHASISWA ================= -->
  <div x-data="mahasiswaSelect()" class="space-y-2">
    <label class="block text-sm font-medium text-gray-700">
      Daftar Mahasiswa
    </label>

    <div
      class="border rounded-xl p-2 flex flex-wrap gap-2 min-h-[50px] focus-within:ring-2 focus-within:ring-blue-400"
    >
      <template x-for="(item, index) in selected" :key="index">
        <span
          class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm flex items-center gap-2"
        >
          <span x-text="item.nama"></span>

          <button
            @click="remove(index)"
            type="button"
            class="hover:text-red-500"
          >
            ✕
          </button>

          <input
            type="hidden"
            name="daftar_mahasiswa[]"
            :value="item.nim"
          />
        </span>
      </template>

      <select
        @change="add($event)"
        class="flex-1 outline-none bg-transparent text-gray-600"
      >
        <option value="">Pilih Mahasiswa...</option>
        {% for value in list_mahasiswa %}
        <option value="{{ value.id }}">
          {{ value.nama }} - {{ value.nim }}
        </option>
        {% endfor %}
      </select>
    </div>
  </div>

  <!-- ================= MATA KULIAH ================= -->
  <div x-data="mataKuliahSelect()" class="space-y-2">
    <label class="block text-sm font-medium text-gray-700">
      Daftar Mata Kuliah
    </label>

    <div
      class="border rounded-xl p-2 flex flex-wrap gap-2 min-h-[50px] focus-within:ring-2 focus-within:ring-blue-400"
    >
      <template x-for="(item, index) in selected" :key="index">
        <span
          class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm flex items-center gap-2"
        >
          <span x-text="item.nama"></span>

          <button
            @click="remove(index)"
            type="button"
            class="hover:text-red-500"
          >
            ✕
          </button>

          <input
            type="hidden"
            name="daftar_pilihan_kelas[]"
            :value="item.id"
          />
        </span>
      </template>

      <select
        @change="add($event)"
        class="flex-1 outline-none bg-transparent text-gray-600"
      >
        <option value="">Pilih mata kuliah...</option>
        {% for value in list_kelas %}
        <option value="{{ value.id }}">
          {{ value.nama }} - {{ value.kode }}
        </option>
        {% endfor %}
      </select>
    </div>
  </div>

  <!-- ================= BUTTON ================= -->
  <div class="flex justify-end gap-3 pt-4 border-t">
    <button
      type="reset"
      class="px-4 py-2 rounded-lg border text-gray-600 hover:bg-gray-100"
    >
      Reset
    </button>

    <button
      type="submit"
      class="px-5 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700"
    >
      Simpan
    </button>
  </div>
</form>

<script>
  function mahasiswaForm() {
    return {
      mahasiswa: [""],

      add() {
        this.mahasiswa.push("");
      },

      remove(index) {
        this.mahasiswa.splice(index, 1);
      },
    };
  }

  function mahasiswaSelect() {
    return {
      selected: [],

      add(event) {
        const select = event.target;
        const nim = select.value;
        const text = select.options[select.selectedIndex].text;

        if (nim && !this.selected.find((item) => item.nim === nim)) {
          this.selected.push({
            nim: nim,
            nama: text,
          });
        }

        select.value = "";
      },

      remove(index) {
        this.selected.splice(index, 1);
      },
    };
  }

  function mataKuliahSelect() {
    return {
      selected: [],

      add(event) {
        const select = event.target;
        const id = select.value;
        const text = select.options[select.selectedIndex].text;

        if (id && !this.selected.find((item) => item.id === id)) {
          this.selected.push({
            id: id,
            nama: text,
          });
        }

        select.value = "";
      },

      remove(index) {
        this.selected.splice(index, 1);
      },
    };
  }
</script>

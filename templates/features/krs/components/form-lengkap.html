<form method="POST" class="max-w-2xl mx-auto bg-white shadow-md rounded-2xl p-6 space-y-6">
   

    <!-- Title -->
    <h2 class="text-xl font-semibold text-gray-800">
        Form Input Data
    </h2>

    <!-- ================= INPUT TEXT ================= -->
    <div class="space-y-4">

        

        <!-- jumlah_sks -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
                Jumlah SKS
            </label>
            <input 
                type="text" 
                name="jumlah_sks"
                class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-400 focus:outline-none"
                placeholder="Masukkan jumlah_sks"
            >
        </div>

    </div>

    <!-- ================= MAHASISWA ================= -->
    <div x-data="mahasiswaForm()" class="space-y-3">

        <label class="block text-sm font-medium text-gray-700">
            Mahasiswa
        </label>

        <template x-for="(item, index) in mahasiswa" :key="index">
            <div class="flex gap-2 items-center">

                <input 
                    type="text" 
                    name="mahasiswa[]" 
                    x-model="mahasiswa[index]"
                    class="flex-1 border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-400 focus:outline-none"
                    placeholder="NIM"
                >

                <button 
                    type="button"
                    @click="remove(index)"
                    class="bg-red-500 text-white px-3 py-2 rounded-lg hover:bg-red-600"
                    x-show="mahasiswa.length > 1"
                >
                    Hapus
                </button>
            </div>
        </template>

        <button 
            type="button"
            @click="add()"
            class="text-sm bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600"
        >
            + Tambah Mahasiswa
        </button>

    </div>

    <!-- ================= MATA KULIAH ================= -->
    <div x-data="mataKuliahSelect()" class="space-y-2">

        <label class="block text-sm font-medium text-gray-700">
            Daftar Mata Kuliah
        </label>

        <div class="border rounded-xl p-2 flex flex-wrap gap-2 min-h-[50px] focus-within:ring-2 focus-within:ring-blue-400">

            <template x-for="(item, index) in selected" :key="index">
                <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm flex items-center gap-2">
                    <span x-text="item"></span>

                    <button @click="remove(index)" type="button" class="hover:text-red-500">
                        ✕
                    </button>

                    <input type="hidden" name="daftar_pilihan_mata_kuliah" :value="item">
                </span>
            </template>

            <select 
                @change="add($event)"
                class="flex-1 outline-none bg-transparent text-gray-600"
            >
                <option value="">Pilih mata kuliah...</option>
                {% for value in list_mata_kuliah %}
                    <option value="{{ value }}">{{ value }} - {{ value }}</option>
                {% endfor %}
            </select>

        </div>

    </div>

    <!-- ================= BUTTON ================= -->
    <div class="flex justify-end gap-3 pt-4 border-t">

        <button 
            type="reset"
            class="px-4 py-2 rounded-lg border text-gray-600 hover:bg-gray-100"
        >
            Reset
        </button>

        <button 
            type="submit"
            class="px-5 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700"
        >
            Simpan
        </button>

    </div>

</form>


<script>
function mahasiswaForm() {
    return {
        mahasiswa: [''],

        add() {
            this.mahasiswa.push('')
        },

        remove(index) {
            this.mahasiswa.splice(index, 1)
        }
    }
}

function mataKuliahSelect() {
    return {
        selected: [],

        add(event) {
            let value = event.target.value
            if (value && !this.selected.includes(value)) {
                this.selected.push(value)
            }
            event.target.value = ''
        },

        remove(index) {
            this.selected.splice(index, 1)
        }
    }
}
</script>

{% extends "layouts/base.html" %}

{% block content %}
<div class="p-6" x-data="detail_kelas_page()"
    @open-daftar-tugas.window="handleOpenDaftarTugas()"
>
    {% include "kelas/partials/kelas-card.html" %}
</div>

{% endblock content %}

{% block script %}

<script>
    function detail_kelas_page() {
        return {
            loading: false,

            handleOpenDaftarTugas() {
                window.location.href = "{% url 'penugasan:daftar_tugas_by_kelas' kelas.id %}";
            }
        }
    }
</script>

{% endblock script %}
